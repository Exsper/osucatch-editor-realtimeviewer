name: Release

on:
  push:
    branches:
      - "master"
      - "dev"
      
jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 8.0.x

    - name: Setup MSYS2 (native library toolchains)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-i686-gcc

    - name: Build x64 StableCompatLib
      shell: msys2 {0}
      env:
        MSYSTEM: MINGW64
      run: |
        test "$(g++ -dumpmachine)" = "x86_64-w64-mingw32"
        cd StableCompatLib
        mkdir -p x64
        g++ -c StableCompatLib.cpp -o x64/StableCompatLib-x64.o
        g++ -shared -static -static-libgcc -static-libstdc++ -Wl,--kill-at -lm -o x64/StableCompatLib.dll x64/StableCompatLib-x64.o
        ! objdump -p x64/StableCompatLib.dll | grep -E "DLL Name: (libgcc|libstdc\+\+|libwinpthread)"

    - name: Build x86 StableCompatLib
      shell: msys2 {0}
      env:
        MSYSTEM: MINGW32
      run: |
        test "$(g++ -dumpmachine)" = "i686-w64-mingw32"
        cd StableCompatLib
        mkdir -p x86
        g++ -c StableCompatLib.cpp -o x86/StableCompatLib-x86.o
        g++ -shared -static -static-libgcc -static-libstdc++ -Wl,--kill-at -lm -o x86/StableCompatLib.dll x86/StableCompatLib-x86.o
        ! objdump -p x86/StableCompatLib.dll | grep -E "DLL Name: (libgcc|libstdc\+\+|libwinpthread)"

    - name: Restore dependencies (x64)
      run: dotnet restore osucatch-editor-realtimeviewer -r win-x64
      
    - name: Build x64
      run: dotnet build osucatch-editor-realtimeviewer -c Release /p:Platform=x64 -r win-x64 --no-restore

    - name: Create x64 release zip
      uses: thedoctor0/zip-release@master
      with:
        type: 'zip'
        filename: 'release-x64.zip'
        directory: 'osucatch-editor-realtimeviewer/bin/x64/Release/net8.0-windows7.0/win-x64/'

    - name: Restore dependencies (x86)
      run: dotnet restore osucatch-editor-realtimeviewer -r win-x86

    - name: Build x86
      run: dotnet build osucatch-editor-realtimeviewer -c Release /p:Platform=x86 -r win-x86 --no-restore

    - name: Create x86 release zip
      uses: thedoctor0/zip-release@master
      with:
        type: 'zip'
        filename: 'release-x86.zip'
        directory: 'osucatch-editor-realtimeviewer/bin/x86/Release/net8.0-windows7.0/win-x86/'

    - name: Publish x86 self-contained
      run: dotnet publish osucatch-editor-realtimeviewer -c Release /p:Platform=x86 -r win-x86 --self-contained true --no-restore -o osucatch-editor-realtimeviewer/publish/win-x86-selfcontained

    - name: Copy StableCompatLib to self-contained output
      # dotnet publish does not include StableCompatLib.dll (it is copied to OutDir by a Copy task),
      # so copy the x86 library into the publish output manually before zipping.
      run: Copy-Item StableCompatLib\x86\StableCompatLib.dll osucatch-editor-realtimeviewer\publish\win-x86-selfcontained\

    - name: Create x86 self-contained release zip
      uses: thedoctor0/zip-release@master
      with:
        type: 'zip'
        filename: 'release-x86-self-contained.zip'
        directory: 'osucatch-editor-realtimeviewer/publish/win-x86-selfcontained/'

    - name: Upload x64 artifact (dev only)
      if: github.ref == 'refs/heads/dev'
      uses: actions/upload-artifact@v4
      with:
        name: release-x64
        path: osucatch-editor-realtimeviewer/bin/x64/Release/net8.0-windows7.0/win-x64/release-x64.zip

    - name: Upload x86 artifact (dev only)
      if: github.ref == 'refs/heads/dev'
      uses: actions/upload-artifact@v4
      with:
        name: release-x86
        path: osucatch-editor-realtimeviewer/bin/x86/Release/net8.0-windows7.0/win-x86/release-x86.zip

    - name: Upload x86 self-contained artifact (dev only)
      if: github.ref == 'refs/heads/dev'
      uses: actions/upload-artifact@v4
      with:
        name: release-x86-self-contained
        path: osucatch-editor-realtimeviewer/publish/win-x86-selfcontained/release-x86-self-contained.zip

    - name: Generate release tag
      if: github.ref == 'refs/heads/master'
      id: generate_release_tag
      uses: alexvingg/next-release-tag@v1.0.4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag_prefix: ''

    - name: Create Release
      if: github.ref == 'refs/heads/master'
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: false
        automatic_release_tag: ${{ steps.generate_release_tag.outputs.release_tag }}
        title: Release ${{ steps.generate_release_tag.outputs.release_tag }}
        files: |
          osucatch-editor-realtimeviewer/bin/x64/Release/net8.0-windows7.0/win-x64/release-x64.zip
          osucatch-editor-realtimeviewer/bin/x86/Release/net8.0-windows7.0/win-x86/release-x86.zip
          osucatch-editor-realtimeviewer/publish/win-x86-selfcontained/release-x86-self-contained.zip
